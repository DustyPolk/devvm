name: CI

# Docs-only changes run only the Docs workflow's checks. Later patterns win:
# the CLI reference is generated, and a test checks it is current.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "docs/content/docs/cli/**"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "docs/content/docs/cli/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.18
      - run: mise run lint
      - run: mise run test
