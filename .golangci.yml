version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - reassign
    - revive
    - unconvert
    - usestdlibvars
  settings:
    depguard:
      rules:
        # The proxy, and the background-process helper it uses: the
        # standard library alone.
        proxy:
          list-mode: strict
          files:
            - "**/internal/proxy/**"
            - "**/internal/daemon/**"
          allow:
            - $gostd
            - github.com/w3cj/devvm/internal/proxy
            - github.com/w3cj/devvm/internal/daemon
        main:
          list-mode: strict
          files:
            - $all
            - "!$test"
            - "!**/internal/proxy/**"
            - "!**/internal/daemon/**"
          allow:
            - $gostd
            - github.com/w3cj/devvm
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            # The CLI reference generator (approved).
            - github.com/spf13/cobra/doc
            - github.com/nicksnyder/go-i18n/v2
            # The TOML parser go-i18n's docs register for locales/*.toml
            # (approved; the generator reads en.toml with it too).
            - github.com/BurntSushi/toml
            - golang.org/x/text
            - golang.org/x/term
            - golang.org/x/sys
        tests:
          list-mode: strict
          files:
            - $test
            - "!**/internal/proxy/**"
            - "!**/internal/daemon/**"
          allow:
            - $gostd
            - github.com/w3cj/devvm
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            - github.com/nicksnyder/go-i18n/v2
            - github.com/BurntSushi/toml
            - golang.org/x/text
            - golang.org/x/term
            - golang.org/x/sys
            - github.com/rogpeppe/go-internal
        ui:
          files:
            - $all
            - "!**/cmd/devvm/**"
            - "!**/internal/cli/**"
            - "!**/internal/ui/**"
          deny:
            - pkg: github.com/w3cj/devvm/internal/ui
              desc: only cmd/devvm and internal/cli hold the UI; take what you need as fields.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.Exit$
          msg: return an error; only cmd/devvm exits.
        - pattern: ^fmt\.Print(f|ln)?$
          msg: print through internal/ui.
        - pattern: ^os\.(Stdout|Stderr)$
          msg: print through internal/ui.
        - pattern: ^context\.(Background|TODO)$
          msg: take the caller's ctx; a fresh one only where it must outlive it, with a nolint saying why.
        - pattern: ^(runtime\.NumCPU|unix\.(Statfs|Fstatfs|Sysinfo|SysctlUint64)|syscall\.(Statfs|Fstatfs|Sysinfo))$
          msg: read the host's CPUs, memory and free space through platform.Host, which test builds can override.
        - pattern: ^testbuild\.On$
          msg: only internal/cli asks whether this is a test build, in readOverrides; take its overrides as fields.
        - pattern: ^(os\.FindProcess|syscall\.Kill|unix\.Kill)$
          msg: signal processes through internal/daemon (Proc, Handle, Alive, Signal), which checks a pid is still the process it was.
        - pattern: ^http\.(Client|DefaultClient|DefaultTransport|Get|Head|Post|PostForm)$
          msg: reach the web through internal/fetch (fetch.NewClient, fetch.Client), which sets the timeout, the redirect policy and retries.
    nolintlint:
      require-explanation: true
      require-specific: true
    reassign:
      patterns:
        - ".*"
    revive:
      enable-default-rules: true
      rules:
        # Just above the largest today: statements, then lines.
        - name: function-length
          arguments: [100, 160]
        - name: cognitive-complexity
          arguments: [75]
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: ^cmd/devvm/
        linters: [forbidigo]
        text: os\.Exit|context\.(Background|TODO)
      - path: ^internal/ui/
        linters: [forbidigo]
        text: fmt\.Print|os\.(Stdout|Stderr)|context\.(Background|TODO)
      - path: ^internal/platform/
        linters: [forbidigo]
        text: runtime\.NumCPU|unix\.|syscall\.
      - path: ^internal/cli/
        linters: [forbidigo]
        text: testbuild\.On
      - path: ^internal/(daemon|platform)/
        linters: [forbidigo]
        text: os\.FindProcess|syscall\.Kill|unix\.Kill
      # The proxy is the standard library only, and tests make their own
      # servers' clients.
      - path: ^internal/(fetch|proxy)/|_test\.go$
        linters: [forbidigo]
        text: http\.
    paths:
      - ^\.agents/

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/w3cj/devvm
  exclusions:
    paths:
      - ^\.agents/
