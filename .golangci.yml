version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - reassign
    - revive
    - unconvert
    - usestdlibvars
  settings:
    depguard:
      rules:
        proxy:
          list-mode: strict
          files:
            - "**/internal/proxy/**"
          allow:
            - $gostd
            - github.com/w3cj/devvm/internal/proxy
        main:
          list-mode: strict
          files:
            - $all
            - "!$test"
            - "!**/internal/proxy/**"
          allow:
            - $gostd
            - github.com/w3cj/devvm
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            # The CLI reference generator (approved).
            - github.com/spf13/cobra/doc
            - github.com/nicksnyder/go-i18n/v2
            # The TOML parser go-i18n's docs register for locales/*.toml
            # (approved; the generator reads en.toml with it too).
            - github.com/BurntSushi/toml
            - golang.org/x/text
            - golang.org/x/term
            - golang.org/x/sys
        tests:
          list-mode: strict
          files:
            - $test
            - "!**/internal/proxy/**"
          allow:
            - $gostd
            - github.com/w3cj/devvm
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            - github.com/nicksnyder/go-i18n/v2
            - github.com/BurntSushi/toml
            - golang.org/x/text
            - golang.org/x/term
            - golang.org/x/sys
            - github.com/rogpeppe/go-internal
        ui:
          files:
            - $all
            - "!**/cmd/devvm/**"
            - "!**/internal/cli/**"
            - "!**/internal/ui/**"
          deny:
            - pkg: github.com/w3cj/devvm/internal/ui
              desc: only cmd/devvm and internal/cli hold the UI; take what you need as fields.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.Exit$
          msg: return an error; only cmd/devvm exits.
        - pattern: ^fmt\.Print(f|ln)?$
          msg: print through internal/ui.
        - pattern: ^os\.(Stdout|Stderr)$
          msg: print through internal/ui.
        - pattern: ^context\.(Background|TODO)$
          msg: take the caller's ctx; a fresh one only where it must outlive it, with a nolint saying why.
    nolintlint:
      require-explanation: true
      require-specific: true
    reassign:
      patterns:
        - ".*"
    revive:
      enable-default-rules: true
      rules:
        # Just above the largest today: statements, then lines.
        - name: function-length
          arguments: [100, 160]
        - name: cognitive-complexity
          arguments: [75]
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: ^cmd/devvm/
        linters: [forbidigo]
        text: os\.Exit|context\.(Background|TODO)
      - path: ^internal/ui/
        linters: [forbidigo]
        text: fmt\.Print|os\.(Stdout|Stderr)|context\.(Background|TODO)
    paths:
      - ^\.agents/

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/w3cj/devvm
  exclusions:
    paths:
      - ^\.agents/
