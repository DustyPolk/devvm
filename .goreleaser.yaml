# Release builds, run by scripts/release.sh (never on its own: it checks the
# tag and signs SHA256SUMS). Nothing is published from here.
version: 2
project_name: devvm

builds:
  # Linux's, built first on their own (release.sh's first pass), so their SHA-256s are known
  # before the macOS builds.
  - id: devvm
    main: ./cmd/devvm
    binary: devvm
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    # devvm reads its version from internal/cli, not main.
    ldflags:
      - -s -w -X github.com/w3cj/devvm/internal/cli.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  # macOS's, with their processor's Linux build's address (its Linux archive) and the SHA-256 of the
  # devvm in it, which the Docker backend fetches and checks before use. release.sh sets
  # DEVVM_RELEASE_URL and DEVVM_LINUX_SHA256_ARM64/_AMD64; without them this build fails.
  - id: devvm-darwin
    main: ./cmd/devvm
    binary: devvm
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags:
      - >-
        -s -w -X github.com/w3cj/devvm/internal/cli.version={{ .Version }}
        -X github.com/w3cj/devvm/internal/backend/registry.linuxURL={{ .Env.DEVVM_RELEASE_URL }}/devvm-{{ .Version }}-linux-{{ .Arch }}.tar.gz
        -X github.com/w3cj/devvm/internal/backend/registry.linuxSHA256={{ if eq .Arch "arm64" }}{{ .Env.DEVVM_LINUX_SHA256_ARM64 }}{{ else }}{{ .Env.DEVVM_LINUX_SHA256_AMD64 }}{{ end }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# One archive per platform: the binary (its own files embedded), the README, changelog and license.
archives:
  - id: devvm
    ids: [devvm, devvm-darwin]
    formats: [tar.gz]
    name_template: devvm-{{ .Version }}-{{ .Os }}-{{ .Arch }}
    wrap_in_directory: true
    files:
      - src: LICENSE
        info: &info
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info: *info
      - src: CHANGELOG.md
        info: *info

# The source, for the Homebrew formula, which builds from it.
source:
  enabled: true
  name_template: devvm-{{ .Version }}
  format: tar.gz
  prefix_template: devvm-{{ .Version }}/

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

# A build from HEAD (release.sh --head) gets VERSION's version too.
snapshot:
  version_template: "{{ .Env.DEVVM_VERSION }}"

changelog:
  disable: true

release:
  github:
    owner: w3cj
    name: devvm
