StylesPath = .vale/styles
MinAlertLevel = suggestion

[docs/content/**/*.md]
BasedOnStyles = devvm
# Hugo shortcodes.
TokenIgnores = ({{[<%].*?[%>]}})

[{README.md,SECURITY.md,CONTRIBUTING.md,CHANGELOG.md,assets/oci/README.md,internal/proxy/README.md}]
BasedOnStyles = devvm

# AGENTS.md is terse by design, which none of these rules check, and its
# readers are agents, so chatbot vocabulary (AIWords) is checked here too.
# Filler is off because the file names those words in the rule against them.
# The docs-voice skill's SKILL.md is off for Filler for the same reason.
[{AGENTS.md,.agents/skills/docs-voice/SKILL.md}]
BasedOnStyles = devvm
devvm.Filler = NO

# The cli skill is prose for contributors, so it gets every rule.
[.agents/skills/cli/*.md]
BasedOnStyles = devvm

# Not checked: .agents/skills/docs-voice/tropes.md, whose lists and examples
# are the very words and quoted phrases every devvm rule flags, and
# .agents/skills/security-audit/, which is vendored.
