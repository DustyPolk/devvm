<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap">
{{- $departure := "fonts/departure-mono/DepartureMono-Regular.woff2" | relURL }}
<link rel="preload" href="{{ $departure }}" as="font" type="font/woff2" crossorigin>
<style>
  /* Here, not in custom.css: Hugo moves that file, and relURL keeps this path right. */
  @font-face {
    font-family: "Departure Mono";
    src: url("{{ $departure }}") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
</style>
