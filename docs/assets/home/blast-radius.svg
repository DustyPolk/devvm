<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 210" role="img" aria-labelledby="art-blast-radius">
  <title id="art-blast-radius">Without devvm, a prompt injection, leaked secrets, a supply chain attack and a rogue agent reach your machine one after another, and each one compromises what it reaches: the project, ~/web, then ~/.aws, ~/.ssh and another project, ~/api. With devvm, the project is in a VM, and the same four attacks reach the VM. Each one's path toward your machine ends at the VM's border, so ~/.ssh, ~/.aws and ~/api stay untouched.</title>
  <!-- Without devvm: your machine, with nothing around the project. -->
  <text class="m" x="7" y="11">without devvm</text>
  <rect class="f" x="7" y="14" width="168" height="182"/>
  <rect class="bg" x="8" y="15" width="166" height="180"/>
  <text class="m" x="14" y="39">your machine</text>
  <!-- Every part stays in place. The attacks light up one after another, and the folder each one reaches
       turns red. Each part is drawn in its end colour, so with no motion the drawing shows the end. -->
  <rect class="a attack attack-1" x="21" y="85" width="126" height="12"/>
  <text class="k" x="28" y="95">prompt injection</text>
  <rect class="a attack attack-2" x="21" y="99" width="112" height="12"/>
  <text class="k" x="28" y="109">leaked secrets</text>
  <rect class="a attack attack-3" x="21" y="113" width="98" height="12"/>
  <text class="k" x="28" y="123">supply chain</text>
  <rect class="a attack attack-4" x="21" y="127" width="91" height="12"/>
  <text class="k" x="28" y="137">rogue agent</text>
  <text class="r reach reach-1" x="21" y="81">~/web</text>
  <text class="r reach reach-2" x="63" y="179">~/.aws</text>
  <text class="r reach reach-3" x="14" y="179">~/.ssh</text>
  <text class="r reach reach-4" x="112" y="179">~/api</text>
  <!-- With devvm: the project in a VM on your machine. -->
  <text class="a" x="189" y="11">with devvm</text>
  <rect class="f" x="189" y="14" width="168" height="182"/>
  <rect class="bg" x="190" y="15" width="166" height="180"/>
  <text class="m" x="196" y="39">your machine</text>
  <text class="m" x="196" y="53">VM</text>
  <rect class="f" x="196" y="56" width="154" height="98"/>
  <rect class="s" x="197" y="57" width="152" height="96"/>
  <text class="t" x="203" y="81">~/web</text>
  <text class="t" x="196" y="179">~/.ssh</text>
  <text class="t" x="245" y="179">~/.aws</text>
  <text class="t" x="294" y="179">~/api</text>
  <!-- The same attacks light up in the VM. Each one's path toward your machine draws itself down past the
       ones below it, narrowest last, to the VM's border, and the cross there turns lime. -->
  <rect class="a attack attack-1" x="203" y="85" width="126" height="12"/>
  <text class="k" x="210" y="95">prompt injection</text>
  <rect class="a attack attack-2" x="203" y="99" width="112" height="12"/>
  <text class="k" x="210" y="109">leaked secrets</text>
  <rect class="a attack attack-3" x="203" y="113" width="98" height="12"/>
  <text class="k" x="210" y="123">supply chain</text>
  <rect class="a attack attack-4" x="203" y="127" width="91" height="12"/>
  <text class="k" x="210" y="137">rogue agent</text>
  <rect class="a path path-1" x="325" y="97" width="2" height="53"/>
  <rect class="a path path-2" x="311" y="111" width="2" height="39"/>
  <rect class="a path path-3" x="297" y="125" width="2" height="25"/>
  <rect class="a path path-4" x="283" y="139" width="2" height="11"/>
  <text class="a reach reach-1" x="322" y="158">×</text>
  <text class="a reach reach-2" x="308" y="158">×</text>
  <text class="a reach reach-3" x="294" y="158">×</text>
  <text class="a reach reach-4" x="280" y="158">×</text>
</svg>
