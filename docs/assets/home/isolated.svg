<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 168" role="img" aria-labelledby="art-isolated">
  <title id="art-isolated">On your machine, ~/.ssh, ~/.aws and ~/Documents aren't mounted. Only the project folder, ~/web, goes into its VM, read-write, where .git is locked. The VM's network goes through a proxy on your machine, which lets out to the internet only what its allowlist allows.</title>
  <!-- Your machine. -->
  <text class="m" x="7" y="11">your machine</text>
  <rect class="f" x="7" y="14" width="301" height="140"/>
  <rect class="bg" x="8" y="15" width="299" height="138"/>
  <text class="d" x="21" y="39">× ~/.ssh</text>
  <text class="d" x="91" y="39">× ~/.aws</text>
  <text class="d" x="161" y="39">× ~/Documents</text>
  <!-- The project folder, mounted into the VM. -->
  <rect class="a" x="21" y="84" width="49" height="14"/>
  <text class="k" x="28" y="95">~/web</text>
  <rect class="a" x="70" y="89" width="21" height="4"/>
  <!-- The VM. -->
  <text class="m" x="91" y="67">VM</text>
  <rect class="f" x="98" y="77" width="105" height="70"/>
  <rect class="f" x="91" y="70" width="105" height="70"/>
  <rect class="s" x="92" y="71" width="103" height="68"/>
  <text class="t" x="98" y="95">~/web</text>
  <text class="a" x="147" y="95">rw</text>
  <!-- A lock, then .git. -->
  <rect class="a" x="99" y="114" width="1" height="4"/>
  <rect class="a" x="103" y="114" width="1" height="4"/>
  <rect class="a" x="99" y="114" width="5" height="1"/>
  <rect class="a" x="98" y="118" width="7" height="7"/>
  <text class="t" x="112" y="123">.git</text>
  <text class="a" x="147" y="123">locked</text>
  <!-- Out through the proxy, which checks the allowlist, both on your machine. A block travels it, under
       the proxy, down to the allowlist and back, then out. -->
  <rect class="m" x="196" y="104" width="21" height="2"/>
  <rect class="m" x="240" y="112" width="2" height="14"/>
  <rect class="t mover mover-egress" x="196" y="103" width="4" height="4"/>
  <rect class="f" x="217" y="98" width="49" height="14"/>
  <text class="t" x="224" y="109">proxy</text>
  <rect class="f" x="210" y="126" width="77" height="14"/>
  <text class="t" x="217" y="137">allowlist</text>
  <rect class="a pulse" x="266" y="103" width="56" height="4"/>
  <polygon class="a pulse pulse-2" points="322,98 336,105 322,112"/>
  <!-- The internet: a pixel globe, its meridian and three latitudes. -->
  <circle class="o" cx="352.5" cy="105.5" r="10"/>
  <ellipse class="o" cx="352.5" cy="105.5" rx="4" ry="10"/>
  <line class="o" x1="342.5" y1="105.5" x2="362.5" y2="105.5"/>
  <line class="o" x1="344.5" y1="100.5" x2="360.5" y2="100.5"/>
  <line class="o" x1="344.5" y1="110.5" x2="360.5" y2="110.5"/>
</svg>
