<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 254 181" role="img" aria-labelledby="art-step-pick">
  <title id="art-step-pick">You type devvm, and it shows what the folder's new VM gets: the toolchain node, the agent claude, its size and the network tier allowlist. It asks Customize it? [y/N], and you press enter to make the VM.</title>
  <!-- A terminal on your machine. -->
  <text class="m" x="7" y="11">your machine</text>
  <rect class="f" x="7" y="14" width="240" height="160"/>
  <rect class="bg" x="8" y="15" width="238" height="158"/>
  <!-- devvm, typed out: a cover over it shrinks a cell at a time as the caret moves along. The caret goes
       when the summary shows. -->
  <text class="m" x="14" y="33">~/some-project $</text>
  <text class="t" x="133" y="33">devvm</text>
  <rect class="bg type type-pick" x="133" y="22" width="35" height="14"/>
  <g class="caret caret-pick">
    <text class="a caret-blink caret-blink-pick" x="133" y="33">█</text>
  </g>
  <!-- The new VM's summary, trimmed to fit. -->
  <g class="pick-summary">
    <text class="t" x="14" y="54">This folder's new VM gets:</text>
    <text class="t" x="28" y="70">toolchain node</text>
    <text class="t" x="28" y="86">agent claude</text>
    <text class="t" x="28" y="102">size: 4 CPUs, 8 GiB memory</text>
    <text class="t" x="28" y="118">network tier: allowlist</text>
  </g>
  <!-- The question, then enter, lit as it's pressed. -->
  <g class="pick-ask">
    <text class="a" x="14" y="139">Customize it? [y/N]</text>
    <g class="key key-1">
      <rect class="a" x="14" y="152" width="49" height="14"/>
      <text class="k" x="21" y="163">enter</text>
    </g>
  </g>
</svg>
