<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 140" role="img" aria-labelledby="art-zero-config">
  <title id="art-zero-config">In the VM devvm-web, npm run dev is ready on :5173, and a browser on your machine opens it at localhost:5173. devvm code opens the VM in your editor over SSH. A commit made in the VM has you as its author.</title>
  <!-- Your machine: a browser, then an editor. -->
  <text class="m" x="7" y="11">your machine</text>
  <rect class="f" x="7" y="14" width="126" height="126"/>
  <rect class="s" x="8" y="15" width="124" height="124"/>
  <rect class="f" x="14" y="28" width="112" height="42"/>
  <rect class="s" x="15" y="42" width="110" height="27"/>
  <text class="t" x="21" y="39">localhost:5173</text>
  <text class="d" x="21" y="60">▓▓▓▓ ░░░░░░░░</text>
  <rect class="f" x="14" y="84" width="112" height="42"/>
  <rect class="s" x="15" y="98" width="110" height="27"/>
  <rect class="a" x="14" y="84" width="84" height="14"/>
  <text class="k" x="21" y="95">devvm code</text>
  <text class="m" x="21" y="116">SSH: devvm-web</text>
  <!-- The forwarded port, and the editor's connection. -->
  <text class="a pulse" x="140" y="53">←───ports───</text>
  <text class="m" x="140" y="116">────ssh────→</text>
  <!-- The VM: a dev server, a commit, a prompt. -->
  <text class="m" x="231" y="11">devvm-web</text>
  <rect class="f" x="231" y="14" width="126" height="126"/>
  <rect class="s" x="232" y="15" width="124" height="124"/>
  <text class="m" x="238" y="39">❯</text>
  <text class="t" x="252" y="39">npm run dev</text>
  <text class="m" x="252" y="53">ready on</text>
  <text class="a" x="315" y="53">:5173</text>
  <text class="m" x="238" y="81">❯</text>
  <text class="t" x="252" y="81">git commit</text>
  <text class="m" x="252" y="95">Author:</text>
  <text class="a" x="308" y="95">you</text>
  <text class="m" x="238" y="123">❯</text>
  <text class="a blink" x="252" y="123">█</text>
</svg>
