# Every message devvm prints, in go-i18n's TOML format. Each table is one
# message: its ID is the table's name, "other" is its text (a Go template
# with snake_case fields, {{.vm_name}}), "one" is the text for a count of 1
# when the wording changes (both then take {{.count}}), and "description"
# is an optional note for translators. Doc links are in
# internal/msg/docs.go. Run go generate ./internal/msg after editing.

[home_not_absolute]
other = "HOME isn't an absolute path: set it to your home folder"

[msg_unknown]
other = "no message {{.name}}"

[msg_not_pair]
other = "{{.arg}} is not name=value"

[msg_missing_value]
other = "{{.name}} needs {{.key}}="

[msg_unexpected_value]
other = "{{.name}} takes no {{.key}}="

[msg_repeated_value]
other = "{{.key}}= is given twice"

[msg_bad_count]
other = "count must be a whole number, not {{.value}}"

[usage_error]
description = "reason is the command-line parser's own error, in English"
other = "{{.reason}}: see devvm --help"

[log_details]
other = "(details: {{.file}})"

[log_end]
other = "the end of {{.file}}:"

[run_log_failed]
other = "can't write the run log in {{.dir}}: {{.reason}}"

[backend_lacks]
description = "feature is a feature's name as the backends page lists it (egress-proxy); backend is a backend's name (lima)"
other = "{{.vm}} needs {{.feature}}, and the {{.backend}} backend doesn't have it: use a backend that does"

[backend_unreviewed]
description = "feature is a feature's name as the backends page lists it (egress-proxy); backend is a backend's name (lima)"
other = "{{.vm}} needs {{.feature}}, and the {{.backend}} backend only emulates it, unreviewed: use a backend that has it"

[backend_unknown]
other = "there's no {{.name}} backend: choose one of {{.backends}}"

[backend_unknown_default]
other = "{{.file}} sets the backend to {{.name}}, which doesn't exist: change it to one of {{.backends}}"

[backend_unknown_vm]
other = "{{.vm}} runs on the {{.backend}} backend, which this devvm doesn't have: use the devvm that made it"

[tool_bad_version]
description = "version is quoted, as the tools lock has it"
other = "the tools lock has {{.tool}} version {{.version}}, which isn't a version: run devvm update to resolve the tools again"

[lima_missing]
other = "Lima isn't installed: install Lima 2.0 or newer"

[lima_broken]
other = "limactl --version failed: reinstall Lima"

[lima_old]
other = "Lima {{.version}} is too old: upgrade to Lima 2.0 or newer"

[lima_host_unsupported]
description = "os is Go's name for the host's system (windows)"
other = "the lima backend doesn't run on {{.os}}: use macOS or Linux"

[qemu_missing]
other = "{{.program}} isn't installed: install QEMU"

[lima_global_config]
description = "files is a space-separated list of paths"
other = "Lima would add {{.files}} to every VM devvm starts: move them out of devvm's Lima home"

[vm_has_networks]
other = "{{.vm}} has a network devvm didn't give it: remove the networks from {{.file}}"

[lima_home_too_long]
other = "devvm's Lima home {{.home}} is too long for {{.vm}}'s name: set DEVVM_LIMA_HOME to a shorter folder"

[mount_comma]
other = "Lima can't mount {{.path}}: its path has a comma"

[image_missing]
other = "there's no image {{.key}} in devvm's Lima home: build it again"

[image_in_use]
description = "vms is a space-separated list of VM names"
other = "can't delete image {{.key}}: {{.vms}} use its disk"

[not_an_image]
other = "refusing to delete {{.name}}: it's not an image"

[vm_not_stopped]
other = "{{.vm}} is running: stop it first"

[vm_not_running]
other = "{{.vm}} isn't running: start it first"

[disk_shrink]
description = "have and want are sizes in GiB"
other = "{{.vm}}'s disk is {{.have}} GiB and can't shrink to {{.want}} GiB"

[starting]
other = "starting {{.vm}}"

[stopping]
other = "stopping {{.vm}}"

[deleting]
other = "deleting {{.vm}}"

[creating]
other = "creating {{.vm}}"

[configuring]
other = "configuring {{.vm}}"

[start_failed]
other = "couldn't start {{.vm}}"

[start_no_ssh]
description = "console is a glob of the VM's console logs"
other = "couldn't start {{.vm}}: it doesn't answer over ssh (its console: {{.console}})"

[started_with_warnings]
other = "{{.vm}} started with warnings; continuing"

[stop_failed]
other = "couldn't stop {{.vm}}"

[delete_failed]
other = "couldn't delete {{.vm}}"

[vm_create_failed]
other = "couldn't create {{.vm}}"

[lima_edit_failed]
other = "couldn't change {{.vm}}'s Lima settings"

[qemu_refused]
other = "refusing to start QEMU: expected exactly one -netdev user,id=net0,… to restrict"

[no_ubuntu_image]
other = "couldn't find Ubuntu {{.version}}'s cloud image at {{.url}}: check you're online"

[ubuntu_bad_signature]
description = "release is a dated release's folder name (release-20260101)"
other = "Ubuntu's checksums for {{.release}} at {{.url}} aren't signed by Ubuntu's cloud image key: not using them"

[ubuntu_unsigned]
other = "gpgv isn't installed, so only the HTTPS download vouches for Ubuntu's checksums: install it to check their signature (brew install gnupg, or apt install gpgv)"

[unknown_layer]
description = "layers is a space-separated list of layer names"
other = "there's no layer {{.layer}}: choose from {{.layers}}"

[build_failed]
description = "reason is an error from the system, in English"
other = "couldn't build {{.image}}: {{.reason}}"

[image_leftover]
other = "image {{.key}} is left over from a failed build of {{.image}}: building it again"

[building_image]
other = "building image {{.image}} ({{.key}})"

[base_build_time]
other = "    a few minutes, and Ubuntu's cloud image to download the first time"

[image_ready]
other = "image {{.image}} ready"

[creating_from_ubuntu]
other = "creating {{.vm}} from Ubuntu's cloud image"

[cloning_image]
other = "cloning {{.parent}}'s image"

[running_script]
other = "running {{.script}} in {{.vm}}"

[script_failed]
other = "{{.script}} failed in {{.vm}}"

[interrupted_image]
other = "interrupted: deleting the unfinished image {{.vm}}"

[unfinished_image]
other = "deleting the unfinished image {{.vm}}"

[rebuild_replaces]
description = "above is a space-separated list of image names"
other = "rebuilding {{.image}} replaces it and deletes the images built on it: {{.above}}\nthey're built again when they're next needed; VMs keep the images they have"

[continue]
other = "continue?"

[nothing_changed]
other = "nothing changed"

[deleted_old_image]
other = "deleted the old image {{.image}} ({{.key}})"

[deleted_unfinished_build]
other = "deleted {{.key}}, left over from a failed build"

[vm_outdated]
description = "changed is a comma-separated list of image names"
other = "{{.changed}} changed since this VM was made: it keeps the image it has"
